<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Autofael - Estética Automotiva</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f0f0f;
            color: #f5f5f5;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 30px;
        }

        nav button {
            margin: 10px;
            padding: 10px 20px;
            background: #1a1a1a;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        nav button:hover {
            background: #e10600;
        }

        section {
            padding: 50px 20px;
            max-width: 1100px;
            margin: auto;
        }

        h2 {
            margin-bottom: 30px;
            border-left: 5px solid #f1c40f;
            padding-left: 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .price {
            color: #2ecc71;
            margin-top: 10px;
        }

        footer {
            background: #000;
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            padding-top: 50px;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-conteudo {
            display: block;
            margin: auto;
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
        }

        .fechar {
            position: absolute;
            top: 20px;
            right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>AUTOFAEL</h1>
        <p>Estética Automotiva</p>

        <nav>
            <button onclick="mostrarSecao('servicos')">Serviços</button>
            <button onclick="mostrarSecao('fotos')">Fotos</button>
        </nav>
    </header>

    <!-- SERVIÇOS -->
    <div id="servicos">
        <section>
            <h2>Lavagens</h2>
            <div class="cards">
                <div class="card">
                    <h3>🚗 Lavagem Simples</h3>
                    <p>Limpeza básica interna e externa.</p>
                    <p class="price">R$ 80</p>
                </div>

                <div class="card">
                    <h3>⭐ Lavagem Gold</h3>
                    <p>Lavagem completa com cera premium.</p>
                    <p class="price">R$ 150</p>
                </div>

                <div class="card">
                    <h3>🔥 Lavagem Premium</h3>
                    <p>Com selante cerâmico.</p>
                    <p class="price">R$ 250</p>
                </div>
            </div>
        </section>
    </div>

    <!-- FOTOS -->
    <div id="fotos" style="display:none;">
        <section>
            <h2>Trabalhos Realizados</h2>

            <div class="cards">
                <div class="card">
                    <img src="imagem/Camionete_Finalizada.jpeg" onclick="abrirModal(this)">
                </div>

                <div class="card">
                    <img src="imagem/Carro_que_não_sei_nome.jpeg" onclick="abrirModal(this)">
                </div>

                <div class="card">
                    <img src="imagem/SUV_Espuma.jpeg" onclick="abrirModal(this)">
                </div>
            </div>
        </section>
    </div>,

    <!-- MODAL DA IMAGEM -->
    <div id="modal" class="modal">
        <span class="fechar" onclick="fecharModal()">&times;</span>
        <img class="modal-conteudo" id="imagemModal">
    </div>

    <!-- FOOTER -->
    <footer>
        <a href="https://wa.me/5517996807674" target="_blank"
            style="color: #aaa; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">

            <i class="bi bi-whatsapp" style="color: #25D366;"></i>
            <span>Fale conosco: (17) 99680-7674</span>
        </a>

        <p>© 2026 Autofael</p>
    </footer>

    <!-- SCRIPT -->
    <script>
        function mostrarSecao(secao) {
            document.getElementById('servicos').style.display = 'none';
            document.getElementById('fotos').style.display = 'none';

            document.getElementById(secao).style.display = 'block';
        }
    </script>

    <!--Script para aumentar fotos-->
    <script>
        function mostrarSecao(secao) {
            document.getElementById('servicos').style.display = 'none';
            document.getElementById('fotos').style.display = 'none';

            document.getElementById(secao).style.display = 'block';
        }

        function abrirModal(imagem) {
            document.getElementById("modal").style.display = "block";
            document.getElementById("imagemModal").src = imagem.src;
        }

        function fecharModal() {
            document.getElementById("modal").style.display = "none";
        }
    </script>

</body>

</html>
